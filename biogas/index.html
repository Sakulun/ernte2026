<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f140f">
<title>Biogas · Biomasse-Erfassung</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Biogas im Industrial-Design der Ernte-App (near-black, Bernstein #c8962e) ── */
:root {
  --bg: #090d09; --bg2: #0f140f; --bg3: #141a14;
  --card: #111611; --border: #1e2a1e; --border2: #2a3a2a;
  --gold: #c8962e; --gold2: #e0b040;
  --green: #3d8b3d; --green2: #52a852;
  --amber: #e0b040; --red: #c84040; --blue: #4a8ab0;
  --text: #d8e8d0; --text2: #7a9870; --text3: #4a6040;
  --color-surface: var(--card); --color-border: var(--border);
  --color-text: var(--text); --color-text-muted: var(--text2);
  --color-success: #52a852; --color-success-wash: rgba(82,168,82,.12);
  --color-warning: #e0b040; --color-primary: #c8962e;
  --neutral-200: #161d16;
  --radius: 3px; --radius-lg: 3px; --radius-md: 3px; --radius-sm: 3px; --radius-xs: 2px;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --serif: 'Barlow Condensed', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--mono); background: var(--bg); color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
input, select, textarea, .input {
  width: 100%; padding: 11px 12px; font-size: 13px; font-family: var(--mono);
  background: var(--bg); color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); background: var(--bg2); box-shadow: 0 0 0 2px rgba(200,150,46,0.15); }
input::placeholder { color: var(--text3); }
label { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); margin-bottom: 4px; }
.form-group { margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.4); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-title { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
.card-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.section-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin: 14px 0 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: var(--radius); border: none; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: var(--mono); }
.btn-green { background: var(--green); color: #fff; }
.btn-outline { background: none; border: 1px solid var(--border2); color: var(--text2); }
.btn-amber { background: var(--gold); color: #1a1200; }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 11px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
.badge-fertig { background: rgba(82,168,82,.15); color: var(--green2); }
.empty-state { text-align: center; color: var(--text3); padding: 28px 14px; font-size: 12px; letter-spacing: 1px; }
.stat-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat-val { font-size: 22px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 9px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
.tab { flex: 1; padding: 11px 6px; border-radius: var(--radius) var(--radius) 0 0; border: 1px solid var(--border); border-bottom: none; background: var(--bg2); color: var(--text2); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.tab.active { background: var(--card); color: var(--gold); border-color: var(--border2); box-shadow: inset 0 2px 0 var(--gold); }
.netto-display { display: flex; align-items: baseline; justify-content: center; gap: 8px; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px; margin: 10px 0 14px; }
.netto-label { font-size: 10px; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; }
.netto-val { font-size: 30px; font-weight: 600; color: var(--green2); font-variant-numeric: tabular-nums; }
.netto-unit { font-size: 12px; color: var(--text3); }
.gewicht-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg2); border-bottom: 1px solid var(--border2); box-shadow: 0 2px 0 var(--gold), 0 3px 0 rgba(200,150,46,0.15); }
.topbar-logo { font-family: var(--serif); font-weight: 700; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--text); }
.topbar-user { font-size: 10px; letter-spacing: 1px; color: var(--gold); }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--card); color: var(--text); border: 1px solid var(--gold); border-radius: var(--radius); padding: 12px 20px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.6); display: none; z-index: 9999; max-width: 92vw; }
#toast.error { border-color: var(--red); }
#login-screen { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,42,30,0.4) 39px, rgba(30,42,30,0.4) 40px),
                    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,42,30,0.4) 39px, rgba(30,42,30,0.4) 40px); }
#app { display: none; }
#app.active { display: block; }
.fuhre-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.fuhre-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.fuhre-nr { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--text2); }
table.bg-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
table.bg-tbl th { text-align: right; padding: 8px; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); border-bottom: 2px solid var(--border2); }
table.bg-tbl th:first-child { text-align: left; }
table.bg-tbl td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
table.bg-tbl td:first-child { text-align: left; }
@media (min-width: 700px) { #main-content, .tabs { max-width: 640px; margin-left: auto; margin-right: auto; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="card" style="width:100%;max-width:380px;padding:32px;box-shadow:0 0 0 1px var(--border), 0 24px 64px rgba(0,0,0,0.7)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--text)">Biogas</div>
      <div style="font-size:10px;letter-spacing:4px;color:var(--gold);margin-top:2px">BIOMASSE-ERFASSUNG</div>
    </div>
    <div class="form-group"><label>Benutzername</label><input type="text" id="login-name" placeholder="Name eingeben" autocomplete="username"></div>
    <div class="form-group"><label>Passwort</label><input type="password" id="login-pw" placeholder="Passwort eingeben" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="login-error" style="display:none;font-size:11px;color:var(--red);margin-bottom:10px"></div>
    <button class="btn btn-amber btn-full" onclick="doLogin()">Anmelden</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <span class="topbar-logo">Biogas</span>
    <span class="topbar-user" id="topbar-name"></span>
    <button class="btn btn-sm btn-outline" onclick="doLogout()">Abmelden</button>
  </div>
  <div class="tabs" id="bg-tabs"></div>
  <div id="main-content" style="padding:14px 12px"></div>
</div>

<div id="toast"></div>

<script type="module" src="../js/bg-app.js?v=122"></script>
</body>
</html>
